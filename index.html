<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Food Content Creation Lab</title><script>(async()=>{try{let a=await Promise.all([1,2,3,4,5,6,7,8].map(n=>fetch(`c${n}.txt`).then(r=>{if(!r.ok)throw Error('caricamento');return r.text()})));let b=Uint8Array.from(atob(a.join('')),c=>c.charCodeAt(0));let h=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div style="font-family:sans-serif;padding:40px">Errore di caricamento</div>'}})()</script>
