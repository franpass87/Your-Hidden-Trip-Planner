<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Food Content Creation Lab</title></head><body style="margin:0;background:#f4efe6"><script>Promise.all([1,2,3,4].map(n=>fetch(`part${n}.txt`).then(r=>{if(!r.ok)throw new Error(`Errore parte ${n}`);return r.text()}))).then(parts=>{document.open();document.write(parts.join(''));document.close()}).catch(e=>{document.body.innerHTML='<div style="font-family:sans-serif;padding:40px"><h1>Errore di caricamento</h1><p>'+e.message+'</p></div>'})</script></body></html>
